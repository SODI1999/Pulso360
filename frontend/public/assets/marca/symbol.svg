<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pulso-orbit-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="pulso-wave-grad" x1="14" y1="32" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0D9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Órbita 360 exterior de protección (dos arcos continuos desfasados) -->
  <path
    d="M 32 8 C 45.255 8 56 18.745 56 32 C 56 38.6 53.33 44.58 49 48.9"
    stroke="url(#pulso-orbit-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 32 56 C 18.745 56 8 45.255 8 32 C 8 25.4 10.67 19.42 15 15.1"
    stroke="url(#pulso-orbit-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />

  <!-- Nodo orbital superior de sincronización -->
  <circle cx="49" cy="48.9" r="2.5" fill="#2DD4BF" />
  <circle cx="15" cy="15.1" r="2" fill="#0D9488" />

  <!-- Pulso vital central con onda suave redondeada -->
  <path
    d="M 14 32 H 24 L 28 23 L 33 41 L 38 27 L 41 32 H 50"
    stroke="url(#pulso-wave-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#subtle-glow)"
  />
</svg>
